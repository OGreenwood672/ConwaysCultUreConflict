[project]
name = "server"
version = "0.1.0"
description = "A culty experience"
authors = [
  { name = "Oliver Greenwood", email = "mail@ogwood.dev" },
  { name = "Athena Eng", email = "athena@eng" },
  { name = "Dylan Moss", email = "dylan@moss" },
